<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Music Player</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #121212; color: #ffffff; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .player-card { background-color: #181818; width: 100%; max-width: 400px; border-radius: 12px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 1px solid #282828; }
        .info { text-align: center; margin-bottom: 20px; }
        .title { font-size: 1.3rem; font-weight: bold; margin-bottom: 5px; color: #1db954; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .genre { font-size: 0.9rem; color: #b3b3b3; margin-bottom: 15px; }
        audio { width: 100%; margin-bottom: 20px; filter: invert(0.9); }
        .list-title { font-size: 1rem; font-weight: bold; margin-bottom: 10px; color: #b3b3b3; }
        .tracks-list { list-style: none; }
        .track-item { padding: 12px 10px; border-radius: 6px; cursor: pointer; font-size: 0.95rem; transition: 0.2s; border-bottom: 1px solid #282828; display: flex; justify-content: space-between; }
        .track-item:hover { background: #282828; }
        .track-item.active { color: #ffffff; font-weight: bold; background: #1db954; }
        .status-msg { color: #b3b3b3; text-align: center; font-size: 0.85rem; margin-top: 15px; }
    </style>
</head>
<body>

<div class="player-card">
    <div class="info">
        <div class="title" id="current-title">Выберите поток</div>
        <div class="genre" id="current-genre">Стриминг из интернета 24/7</div>
    </div>
    <audio id="audio" controls></audio>

    <div class="list-title">Доступные аудио-каналы:</div>
    <ul class="tracks-list" id="tracks-list"></ul>
    <div id="status-box" class="status-msg">Статус: Готов к работе</div>
</div>

<script>
    // Постоянные, вечные музыкальные трансляции из интернета, открытые для всех сайтов
    const stations = [
        {
            title: "Lofi Radio Beat",
            genre: "Chill / Изучение / Расслабление",
            src: "https://streamafrica.net"
        },
        {
            title: "Synthwave Zone",
            genre: "Retro / Ретрофутуризм / Драйв",
            src: "https://nightride.fm"
        },
        {
            title: "Chillout Lounge",
            genre: "Ambient / Глубокий звук",
            src: "https://unitedradio.it"
        },
        {
            title: "Classic Masterpieces",
            genre: "Классическая музыка / Оркестр",
            src: "https://radiojar.com"
        }
    ];

    let currentIndex = 0;

    const audio = document.getElementById('audio');
    const titleEl = document.getElementById('current-title');
    const genreEl = document.getElementById('current-genre');
    const listEl = document.getElementById('tracks-list');
    const statusBox = document.getElementById('status-box');

    function renderList() {
        listEl.innerHTML = '';
        stations.forEach((station, index) => {
            const li = document.createElement('li');
            li.className = `track-item ${index === currentIndex ? 'active' : ''}`;
            li.innerHTML = `<span>📻 ${station.title}</span>`;
            li.onclick = () => playTrack(index);
            listEl.appendChild(li);
        });
    }

    function loadTrack(index) {
        currentIndex = index;
        const station = stations[index];
        audio.src = station.src;
        titleEl.textContent = station.title;
        genreEl.textContent = station.genre;
        
        document.querySelectorAll('.track-item').forEach((item, i) => {
            item.classList.toggle('active', i === index);
        });
    }

    function playTrack(index) {
        loadTrack(index);
        statusBox.textContent = "Статус: Буферизация потока...";
        
        audio.play()
            .then(() => {
                statusBox.textContent = "Статус: Воспроизведение онлайн";
            })
            .catch(err => {
                statusBox.textContent = "Ошибка загрузки этого потока.";
                console.log(err);
            });
    }

    // Первичный запуск интерфейса
    renderList();
    loadTrack(0);
</script>

</body>
</html>
