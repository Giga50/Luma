<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Radio Aggregator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #121212; color: #ffffff; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .player-card { background-color: #181818; width: 100%; max-width: 400px; border-radius: 12px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 1px solid #282828; }
        .info { text-align: center; margin-bottom: 20px; }
        .title { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #1db954; }
        audio { width: 100%; margin-bottom: 20px; filter: invert(0.9); }
        .list-title { font-size: 1rem; font-weight: bold; margin-bottom: 10px; color: #b3b3b3; }
        .tracks-list { list-style: none; max-height: 250px; overflow-y: auto; }
        .track-item { padding: 12px 10px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; transition: 0.2s; border-bottom: 1px solid #282828; display: flex; justify-content: space-between; }
        .track-item:hover { background: #282828; }
        .track-item.active { color: #ffffff; font-weight: bold; background: #1db954; }
        .status-msg { color: #b3b3b3; text-align: center; font-size: 0.85rem; margin-top: 15px; }
    </style>
</head>
<body>

<div class="player-card">
    <div class="info">
        <div class="title" id="current-title">Загрузка радиостанций...</div>
    </div>
    <audio id="audio" controls></audio>

    <div class="list-title">Мировые музыкальные потоки:</div>
    <ul class="tracks-list" id="tracks-list"></ul>
    <div id="status-box" class="status-msg">Статус: Подключение...</div>
</div>

<script>
    // Самый стабильный открытый сервер для получения музыки
    const API_URL = 'https://radio-browser.info';

    let stations = [];
    let currentIndex = 0;

    const audio = document.getElementById('audio');
    const titleEl = document.getElementById('current-title');
    const listEl = document.getElementById('tracks-list');
    const statusBox = document.getElementById('status-box');

    async function fetchRadio() {
        try {
            statusBox.textContent = "Статус: Получение списка потоков...";
            const response = await fetch(API_URL);
            
            if (!response.ok) throw new Error("Ошибка сервера");
            
            const data = await response.json();

            // Фильтруем только рабочие ссылки
            stations = data.map(item => ({
                title: item.name.trim() || "Без названия",
                src: item.url_resolved,
                country: item.countrycode || "WW"
            })).filter(station => station.src.startsWith('http'));

            if (stations.length > 0) {
                statusBox.textContent = `Статус: Готово! Найдено станций: ${stations.length}`;
                renderList();
                loadTrack(0);
            } else {
                throw new Error("Список пуст");
            }
        } catch (error) {
            titleEl.textContent = "Ошибка сети";
            statusBox.style.color = "#ff5b5b";
            statusBox.textContent = "Статус: Блокировка CORS или нет интернета.";
            console.error(error);
        }
    }

    function renderList() {
        listEl.innerHTML = '';
        stations.forEach((station, index) => {
            const li = document.createElement('li');
            li.className = `track-item ${index === currentIndex ? 'active' : ''}`;
            li.innerHTML = `<span>📻 ${station.title}</span> <span style="opacity: 0.6">[${station.country}]</span>`;
            li.onclick = () => playTrack(index);
            listEl.appendChild(li);
        });
    }

    function loadTrack(index) {
        currentIndex = index;
        const station = stations[index];
        audio.src = station.src;
        titleEl.textContent = station.title;
        
        document.querySelectorAll('.track-item').forEach((item, i) => {
            item.classList.toggle('active', i === index);
        });
    }

    function playTrack(index) {
        loadTrack(index);
        audio.play().catch(err => {
            statusBox.textContent = "Статус: Ошибка потока, выберите другой.";
            console.log("Ошибка воспроизведения:", err);
        });
    }

    // Запуск агрегатора
    fetchRadio();
</script>

</body>
</html>
